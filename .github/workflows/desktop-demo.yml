name: Windows demo package

# Builds dist/IQRAFI-Demo-win-x64.zip (IQRAFI.exe + embedded demo database) on Windows,
# then starts the packaged IQRAFI.exe and checks that the site responds before publishing it.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build

      - name: Smoke-test the packaged IQRAFI.exe
        shell: pwsh
        run: |
          # Test exactly what testers get: extract the zip to a fresh folder.
          $dir = Join-Path $env:RUNNER_TEMP "iqrafi-test"
          Expand-Archive -Path dist/IQRAFI-Demo-win-x64.zip -DestinationPath $dir -Force
          Get-ChildItem -Force "$dir/IQRAFI-Demo/app" | Format-Table Name
          if (-not (Test-Path "$dir/IQRAFI-Demo/app/.next/BUILD_ID")) { throw "app/.next/BUILD_ID is missing from the package" }
          $p = Start-Process -FilePath "$dir/IQRAFI-Demo/IQRAFI.exe" -WorkingDirectory "$dir/IQRAFI-Demo" -PassThru `
                 -RedirectStandardOutput "$dir/out.log" -RedirectStandardError "$dir/err.log"
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 3
            foreach ($url in @("http://127.0.0.1:3000/api/stats", "http://localhost:3000/api/stats")) {
              try { $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "OK: $url -> $($r.Content)" } } catch {}
            }
            if ($ok) { break }
            if ($p.HasExited) { break }
          }
          foreach ($url in @("http://127.0.0.1:3000/", "http://localhost:3000/", "http://127.0.0.1:3000/quran/juz/1")) {
            try { $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15; Write-Host "$url -> $($r.StatusCode)" } catch { Write-Host "$url -> FAILED: $($_.Exception.Message)"; $ok = $false }
          }
          Write-Host "----- launcher output -----"; Get-Content "$dir/out.log" -ErrorAction SilentlyContinue
          Write-Host "----- launcher errors -----"; Get-Content "$dir/err.log" -ErrorAction SilentlyContinue
          Write-Host "----- iqrafi.log -----"; Get-Content "$env:LOCALAPPDATA/IQRAFI-Demo/iqrafi.log" -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { throw "IQRAFI.exe did not serve the site on Windows" }

      - uses: actions/upload-artifact@v4
        with:
          name: IQRAFI-Demo-win-x64
          path: dist/IQRAFI-Demo/
          # The app's build output lives in the hidden "app/.next" folder; it must be included.
          include-hidden-files: true
